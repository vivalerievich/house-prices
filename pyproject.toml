[project]
name = "house-prices"
version = "0.1.0"
description = "Reproducible Ames house-price regression on the Kaggle training data"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "catboost==1.2.10",
    "joblib==1.6.0",
    "numpy==2.4.6",
    "pandas==2.3.3",
    "scikit-learn==1.7.2",
]

[project.scripts]
house-prices = "house_prices.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest==9.0.1",
    "ruff==0.14.5",
]
notebook = [
    "ipykernel==7.4.0",
    "jupyterlab==4.6.6",
    "lightgbm==4.7.0",
    "matplotlib==3.11.2",
    "optuna==5.0.0",
    "plotly==7.1.0",
    "scikit-optimize==0.10.2",
    "scipy==1.17.1",
    "seaborn==0.13.2",
    "threadpoolctl==3.8.0",
    "xgboost==3.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
